services:
  relay:
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        VITE_REMOTE_CONFIG_URL: https://ipvizion.app
    restart: unless-stopped
    environment:
      TRUST_PROXY: '1'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    # No public port: only the Caddy container can reach the relay.
    networks: [relay]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [relay]
networks:
  relay:
volumes:
  caddy_data:
  caddy_config:
